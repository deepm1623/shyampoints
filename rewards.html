<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Shyam Points | Rewards</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="app-body sp-app dashboard-layout">
    <div id="sp-loader" class="sp-loader"><div class="sp-loader-ring"></div></div>
    <div class="app-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <div id="toast-wrap" class="app-toast-wrap"></div>
    <aside id="app-sidebar" class="sp-sidebar"></aside>
    <div class="sp-shell">
      <header class="sp-topbar">
        <div class="sp-topbar-left"></div>
        <div class="sp-topbar-center">
          <label class="sp-search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="reward-search" placeholder="Search rewards…" aria-label="Search rewards" /></label>
        </div>
        <div class="sp-topbar-right">
          <button type="button" class="sp-icon-btn" id="header-notify" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
          <span id="header-points-badge" class="sp-points-badge">--</span>
          <img id="header-avatar" class="sp-avatar header-avatar avatar-placeholder" src="" alt="" width="44" height="44" />
        </div>
      </header>
      <div class="sp-body">
        <main class="sp-main">
          <div class="page-title-block" style="margin-bottom:20px">
            <h1>Rewards</h1>
            <p>Redeem your points for premium rewards</p>
          </div>
          <div class="toolbar-premium sp-toolbar-mobile">
            <label class="sp-search sp-search-inline">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="search" id="reward-search-mobile" placeholder="Search rewards…" aria-label="Search rewards" />
            </label>
            <select id="reward-sort" aria-label="Sort rewards">
              <option value="points-asc">Points: Low to High</option>
              <option value="points-desc">Points: High to Low</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
          <div id="reward-grid" class="reward-grid"></div>
        </main>
      </div>
    </div>
    <nav id="app-bottom-nav"></nav>
    <div id="redeem-modal" class="app-modal hidden">
      <div class="modal-panel">
        <h3 id="redeem-title">Confirm redeem</h3>
        <p id="redeem-text"></p>
        <div class="modal-actions">
          <button type="button" class="sp-btn sp-btn-ghost" id="cancel-redeem">Cancel</button>
          <button type="button" class="sp-btn sp-btn-primary" id="confirm-redeem">Redeem</button>
        </div>
      </div>
    </div>
    <script type="module" src="js/rewards-page.js"></script>
  </body>
</html>
