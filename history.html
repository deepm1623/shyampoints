<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Shyam Points | History</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="app-body sp-app dashboard-layout history-page">
    <div id="sp-loader" class="sp-loader"><div class="sp-loader-ring"></div></div>
    <div class="app-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <div id="toast-wrap" class="app-toast-wrap"></div>
    <aside id="app-sidebar" class="sp-sidebar"></aside>
    <div class="sp-shell">
      <header class="sp-topbar">
        <div class="sp-topbar-left"></div>
        <div class="sp-topbar-center">
          <label class="sp-search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="history-search" placeholder="Search transactions…" aria-label="Search" /></label>
        </div>
        <div class="sp-topbar-right">
          <button type="button" class="sp-icon-btn" id="header-notify" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
          <span id="header-points-badge" class="sp-points-badge">--</span>
          <img id="header-avatar" class="sp-avatar header-avatar avatar-placeholder" src="" alt="" width="44" height="44" />
        </div>
      </header>
      <div class="sp-body">
        <main class="sp-main">
          <div class="page-title-block" style="margin-bottom:20px">
            <h1>Transactions</h1>
            <p>Earned and redeemed activity from your account</p>
          </div>
          <div class="toolbar-premium">
            <select id="history-filter" aria-label="Filter">
              <option value="all">All</option>
              <option value="earned">Earned</option>
              <option value="redeemed">Redeemed</option>
            </select>
          </div>
          <div class="glass-panel"><div id="history-timeline" class="timeline"></div></div>
        </main>
      </div>
    </div>
    <nav id="app-bottom-nav"></nav>
    <script type="module" src="js/history-page.js"></script>
  </body>
</html>
