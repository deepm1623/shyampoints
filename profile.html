<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shyam Points | Profile</title>
    <link rel="icon" href="favicon.ico?v=1" sizes="any" />
    <link rel="shortcut icon" href="favicon.ico?v=1" />
    <link rel="apple-touch-icon" href="favicon.ico?v=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="app-body sp-app dashboard-layout">
    <div id="sp-loader" class="sp-loader"><div class="sp-loader-ring"></div></div>
    <div class="app-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <div id="toast-wrap" class="app-toast-wrap"></div>
    <aside id="app-sidebar" class="sp-sidebar"></aside>
    <div class="sp-shell">
      <header class="sp-topbar">
        <div class="sp-topbar-left">
          <p class="sp-greeting">Hello <span id="welcome-name">--</span> 👋</p>
          <p class="sp-topbar-meta"><span data-tier class="sp-pill">--</span> · <span id="hero-id">--</span></p>
        </div>
        <div class="sp-topbar-center">
          <label class="sp-search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" placeholder="Search…" aria-label="Search" /></label>
        </div>
        <div class="sp-topbar-right">
          <button type="button" class="sp-icon-btn" id="header-notify" aria-label="Notifications"><i class="fa-solid fa-bell"></i></button>
          <span id="header-points-badge" class="sp-points-badge">--</span>
          <img id="header-avatar" class="sp-avatar header-avatar avatar-placeholder" src="" alt="" width="44" height="44" />
        </div>
      </header>
      <div class="sp-body">
        <main class="sp-main profile-page-wrap">
          <div class="page-title-block">
            <h1>Profile</h1>
            <p>Your membership and account details</p>
          </div>
          <article class="profile-premium-card">
            <img id="profile-avatar" class="profile-avatar avatar-placeholder" alt="Profile" width="120" height="120" />
            <h2 id="profile-name">--</h2>
            <span data-tier class="sp-badge bronze">--</span>
            <div class="profile-meta-grid">
              <div><small>Email</small><strong id="profile-email">--</strong></div>
              <div><small>Mobile</small><strong id="profile-phone">--</strong></div>
              <div><small>City</small><strong id="profile-city">--</strong></div>
              <div><small>Role</small><strong id="profile-role">--</strong></div>
              <div><small>Current points</small><strong id="profile-points">--</strong></div>
              <div><small>Lifetime points</small><strong id="profile-lifetime">--</strong></div>
              <div><small>Wallet balance</small><strong id="profile-wallet">--</strong></div>
              <div><small>Member ID</small><strong id="profile-id">--</strong></div>
            </div>
            <button type="button" class="sp-btn sp-btn-primary sp-btn-full" id="edit-profile-btn">Edit profile</button>
            <button type="button" class="sp-btn sp-btn-ghost sp-btn-full" id="logout-btn">Logout</button>
          </article>
          <div class="quick-actions-premium">
            <a href="history.html" class="quick-action-card"><i class="fa-solid fa-clock-rotate-left"></i>History</a>
            <a href="rewards.html" class="quick-action-card"><i class="fa-solid fa-gift"></i>Rewards</a>
            <a href="notifications.html" class="quick-action-card"><i class="fa-solid fa-bell"></i>Alerts</a>
            <a href="settings.html" class="quick-action-card"><i class="fa-solid fa-gear"></i>Settings</a>
          </div>
        </main>
      </div>
    </div>
    <nav id="app-bottom-nav"></nav>
    <div id="edit-profile-modal" class="app-modal hidden">
      <div class="modal-panel">
        <h3>Edit profile</h3>
        <div class="modal-form">
          <label for="edit-name">Full name</label>
          <input id="edit-name" type="text" autocomplete="name" />
          <label for="edit-phone">Mobile</label>
          <input id="edit-phone" type="tel" autocomplete="tel" />
          <label for="edit-city">City</label>
          <input id="edit-city" type="text" autocomplete="address-level2" />
        </div>
        <div class="modal-actions">
          <button type="button" class="sp-btn sp-btn-ghost" id="cancel-edit-profile">Cancel</button>
          <button type="button" class="sp-btn sp-btn-primary" id="save-edit-profile">Save</button>
        </div>
      </div>
    </div>
    <div id="logout-modal" class="app-modal hidden">
      <div class="modal-panel">
        <h3>Logout?</h3>
        <p>You can sign in again anytime.</p>
        <div class="modal-actions">
          <button type="button" class="sp-btn sp-btn-ghost" id="cancel-logout">Stay</button>
          <button type="button" class="sp-btn sp-btn-primary" id="confirm-logout">Logout</button>
        </div>
      </div>
    </div>
    <script type="module" src="js/profile-page.js"></script>
  </body>
</html>
