<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>Admin Dashboard | Shyam Points</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="../design-system.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar">
      <a href="admin-dashboard.html" class="admin-brand">
        <img src="../shyam points logo.png" alt="" width="36" height="36" />
        <span>Shyam Admin</span>
      </a>
      <nav class="admin-nav">
        <a href="admin-dashboard.html" class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="users.html"><i class="fa-solid fa-users"></i> Users</a>
        <a href="transactions.html"><i class="fa-solid fa-receipt"></i> Transactions</a>
        <a href="qr-generator.html"><i class="fa-solid fa-qrcode"></i> QR Generator</a>
        <a href="rewards-admin.html"><i class="fa-solid fa-gift"></i> Rewards</a>
      </nav>
      <button type="button" class="admin-back" id="admin-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </aside>
    <main class="admin-main">
      <header class="admin-top"><h1>Dashboard</h1></header>
      <div class="admin-stats" id="admin-stats">
        <article class="admin-stat"><p>Total Users</p><h3 id="stat-users">—</h3></article>
        <article class="admin-stat"><p>Total QR Generated</p><h3 id="stat-qr-gen">—</h3></article>
        <article class="admin-stat"><p>Total QR Used</p><h3 id="stat-qr-used">—</h3></article>
        <article class="admin-stat"><p>Total Points Issued</p><h3 id="stat-points">—</h3></article>
        <article class="admin-stat"><p>Pending Redemptions</p><h3 id="stat-pending">—</h3></article>
      </div>
      <div class="admin-panel sp-card">
        <h3>Recent transactions</h3>
        <div id="admin-recent-tx"><p class="muted">Loading…</p></div>
      </div>
    </main>
    <script>window.ADMIN_API_BASE = "http://localhost:3001";</script>
    <script type="module" src="js/admin-dashboard-page.js"></script>
  </body>
</html>
