<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>QR Generator | Shyam Admin</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="../design-system.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar">
      <a href="admin-dashboard.html" class="admin-brand"><img src="../shyam points logo.png" alt="" width="36" height="36" /><span>Shyam Admin</span></a>
      <nav class="admin-nav">
        <a href="admin-dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="users.html"><i class="fa-solid fa-users"></i> Users</a>
        <a href="transactions.html"><i class="fa-solid fa-receipt"></i> Transactions</a>
        <a href="qr-generator.html" class="active"><i class="fa-solid fa-qrcode"></i> QR Generator</a>
        <a href="rewards-admin.html"><i class="fa-solid fa-gift"></i> Rewards</a>
      </nav>
      <button type="button" class="admin-back" id="admin-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </aside>
    <main class="admin-main">
      <header class="admin-top"><h1>QR Generator</h1></header>
      <div class="admin-panel sp-card">
        <h3>Generate print-ready QR codes</h3>
        <p class="muted">22mm × 22mm · 520×520px PNG · ZIP download</p>
        <form id="qr-gen-form" class="admin-form">
          <label>Product<input type="text" id="qr-product" required placeholder="Premium Faucet" /></label>
          <label>Points<input type="number" id="qr-points" required min="1" value="20" /></label>
          <label>Quantity<input type="number" id="qr-quantity" required min="1" max="500" value="10" /></label>
          <button type="submit" class="sp-btn sp-btn-primary">Generate QR batch</button>
        </form>
        <div id="qr-gen-result" class="admin-gen-result" hidden></div>
      </div>
      <div class="admin-panel sp-card" style="margin-top:20px">
        <h3>QR inventory</h3>
        <div id="qr-list-wrap"><p class="muted">Loading…</p></div>
      </div>
    </main>
    <script>window.ADMIN_API_BASE = "http://localhost:3001";</script>
    <script type="module" src="js/admin-qr-page.js"></script>
  </body>
</html>
