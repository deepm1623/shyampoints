<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Scan QR | Shyam Points</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="app-body dashboard-layout">
    <div id="sp-loader" class="sp-loader"><div class="sp-loader-ring"></div></div>
    <div class="app-bg" aria-hidden="true"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <div id="toast-wrap" class="app-toast-wrap"></div>
    <aside id="app-sidebar" class="sidebar app-sidebar"></aside>
    <div class="main-content">
      <div class="page-content">
      <header class="app-header">
        <div><h1>Scan QR</h1><p>Point camera at product QR code</p></div>
      </header>
      <div class="scanner-wrap scanner-card">
        <div class="scan-frame" id="scan-frame">
          <video id="scan-video" playsinline muted aria-label="Camera preview"></video>
          <div class="scan-line" aria-hidden="true"></div>
        </div>
        <p id="scanner-status" class="muted">Allow camera access to scan, or simulate below.</p>
        <div class="toolbar-row" style="justify-content:center">
          <button type="button" class="sp-btn sp-btn-soft" id="toggle-flash">Flashlight</button>
          <button type="button" class="sp-btn sp-btn-primary" id="simulate-scan">Simulate Scan</button>
        </div>
      </div>
      </div>
    </div>
    <nav id="app-bottom-nav" class="app-bottom-nav"></nav>

    <div id="scan-success-modal" class="app-modal hidden">
      <div class="modal-panel">
        <h3>🎉 Scan successful!</h3>
        <p id="scan-points-text">You earned points</p>
        <p class="celebration-num">+<span id="scan-points-number">0</span> pts</p>
        <button type="button" class="sp-btn sp-btn-primary sp-btn-full" id="scan-ok">Continue</button>
      </div>
    </div>
    <div id="scan-error-modal" class="app-modal hidden">
      <div class="modal-panel">
        <h3>Scan failed</h3>
        <p id="scan-error-text">Invalid or already used QR code.</p>
        <button type="button" class="sp-btn sp-btn-primary sp-btn-full" id="scan-error-ok">Try again</button>
      </div>
    </div>
    <script type="module" src="js/scanner-page.js"></script>
  </body>
</html>
